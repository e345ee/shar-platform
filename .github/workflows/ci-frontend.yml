name: CI Frontend

on:
  push:
    branches: [ main, master ]
    paths:
      - 'front/**'
      - 'infra/**'
      - '.github/workflows/ci-frontend.yml'
  pull_request:
    paths:
      - 'front/**'
      - 'infra/**'

permissions:
  contents: read

jobs:
  test-build-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'front/package-lock.json'

      - name: Install
        working-directory: front
        run: npm ci

      - name: Test
        working-directory: front
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build
        working-directory: front
        run: npm run build

      - name: Build gateway image (includes frontend)
        run: docker build -f infra/gateway/Dockerfile -t shar-gateway:ci .

      - name: Trivy scan gateway image (report-only)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: shar-gateway:ci
          format: table
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
